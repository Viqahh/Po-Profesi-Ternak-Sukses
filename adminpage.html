<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Profesi Ternak Sukses</title>
  <style>
    :root {
      --ink: #18212f;
      --muted: #637083;
      --line: #d8dee8;
      --panel: #ffffff;
      --wash: #f4f7fb;
      --accent: #0f766e;
      --danger: #b42318;
      --focus: #2563eb;
      --shadow: 0 18px 48px rgba(24, 33, 47, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 22px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(15, 118, 110, 0.08), transparent 340px),
        var(--wash);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .card {
      width: min(440px, 100%);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 18px 8px;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      box-shadow: 0 10px 28px rgba(15, 118, 110, 0.28);
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .body {
      display: grid;
      gap: 14px;
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: #354154;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input:focus,
    select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
    }

    .actions {
      display: grid;
      gap: 9px;
    }

    .button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(24, 33, 47, 0.14);
    }

    .button.secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .error {
      min-height: 19px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="adminTitle">
    <div class="brand">
      <div class="mark" aria-hidden="true">PO</div>
      <div>
        <h1 id="adminTitle">Admin</h1>
        <p class="subtitle">Masuk admin lalu pilih daerah di halaman utama.</p>
      </div>
    </div>
    <div class="body">
      <div class="field">
        <label for="adminId">Admin ID</label>
        <input id="adminId" autocomplete="username" placeholder="Masukkan Admin ID">
      </div>
      <div class="field">
        <label for="adminPassword">Password Admin</label>
        <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Masukkan password admin">
      </div>
      <div class="actions">
        <button class="button" id="adminLoginBtn" type="button">Masuk Admin</button>
        <button class="button secondary" id="backBtn" type="button">Kembali</button>
      </div>
      <div class="error" id="adminError" role="alert"></div>
    </div>
  </main>

  <script>
    const authKey = "po-ovk-auth-session-v1";
    const adminCredential = {
      id: "PTS100",
      password: "170304"
    };

    const adminId = document.querySelector("#adminId");
    const adminPassword = document.querySelector("#adminPassword");
    const adminError = document.querySelector("#adminError");

    function loginAdmin() {
      const id = adminId.value.trim();
      const password = adminPassword.value.trim();

      if (!id || !password) {
        adminError.textContent = "Admin ID dan password wajib diisi.";
        return;
      }

      if (id !== adminCredential.id || password !== adminCredential.password) {
        adminError.textContent = "Admin ID atau password salah.";
        return;
      }

      localStorage.removeItem("po-sheet-generator-v4");
      localStorage.setItem(authKey, JSON.stringify({
        role: "admin",
        adminId: id,
        submitSecret: password,
        loggedInAt: new Date().toISOString()
      }));
      window.location.href = "index.html";
    }

    document.querySelector("#adminLoginBtn").addEventListener("click", loginAdmin);
    document.querySelector("#backBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });
    [adminId, adminPassword].forEach((field) => {
      field.addEventListener("keydown", (event) => {
        if (event.key === "Enter") loginAdmin();
      });
    });
  </script>
</body>
</html>
